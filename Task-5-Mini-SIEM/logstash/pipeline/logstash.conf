input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_tag => ["linux-system"]
  }

  if [systemd][unit] == "ssh.service" {

    if [message] =~ /^Failed password/ {
      grok {
        match => {
          "message" => "^Failed password for (invalid user )?%{USERNAME:ssh_username} from %{IP:ssh_source_ip} port %{POSINT:ssh_source_port} ssh2$"
        }
        tag_on_failure => ["ssh-grok-failure"]
      }

      if "ssh-grok-failure" not in [tags] and [ssh_username] {
        mutate {
          rename => {
            "ssh_username" => "[user][name]"
            "ssh_source_ip" => "[source][ip]"
            "ssh_source_port" => "[source][port]"
          }
          add_field => {
            "[event][category]" => "authentication"
            "[event][action]" => "ssh-login-failed"
            "[event][outcome]" => "failure"
          }
          add_tag => ["ssh-auth-failure"]
        }
      }
    }

    if [message] =~ /authentication failure/ {
      mutate {
        add_tag => ["ssh-pam-failure"]
      }

      grok {
        match => {
          "message" => ".*rhost=%{IP:ssh_source_ip}.*"
        }
        tag_on_failure => []
      }

      if [ssh_source_ip] {
        mutate {
          rename => {
            "ssh_source_ip" => "[source][ip]"
          }
        }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "linux-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
